name: Devnet Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (v2.1.21)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor from source
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag v0.31.1 anchor-cli --locked

      - name: Verify Installations
        run: |
          solana --version
          anchor --version

      - name: Build Program
        run: anchor build

      - name: Deploy to Devnet
        env:
          SOLANA_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          RPC_URL: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
        run: |
          echo "$SOLANA_KEYPAIR" > deployer.json
          solana config set --url "$RPC_URL" --keypair deployer.json
          solana program deploy target/deploy/fair_degens.so \
            --program-id ${{ secrets.PROGRAM_ADDRESS_KEYPAIR }} \
            --url "$RPC_URL"
