name: Devnet Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Anchor and Solana CLI
        uses: metadaoproject/setup-anchor@v3.4
        with:
          solana-cli-version: '2.2.21'
          anchor-version: '0.31.1'
          node-version: '20'

      - name: Add Anchor and Solana to PATH
        run: |
          echo "$HOME/.avm/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Installations
        run: |
          anchor --version
          solana --version

      - name: Build Program
        run: anchor build

      - name: Deploy to Devnet
        env:
          SOLANA_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          RPC_URL: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
        run: |
          echo "$SOLANA_KEYPAIR" > deployer.json
          solana config set --url "$RPC_URL" --keypair deployer.json
          solana program deploy target/deploy/fair_degens.so \
            --program-id ${{ secrets.PROGRAM_ADDRESS_KEYPAIR }} \
            --url "$RPC_URL"
