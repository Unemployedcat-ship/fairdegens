name: Devnet Build and Deploy
on:
  workflow_dispatch:

jobs:
  build:
    uses: solana-foundation/github-workflows/.github/workflows/reusable-build.yaml@v0.5.0
    with:
      program: "fair_degens"
      program-id: "JDFbBErS5MaPRTJ1paGzod7AeDbfMNWLygi2Thdr64qY"
      network: "devnet"
      deploy: true
      upload_idl: true
      verify: false
      use-squads: false
      priority-fee: "300000"
    secrets:
      DEVNET_SOLANA_DEPLOY_URL: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
      DEVNET_DEPLOYER_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
      PROGRAM_ADDRESS_KEYPAIR: ${{ secrets.PROGRAM_ADDRESS_KEYPAIR }}
